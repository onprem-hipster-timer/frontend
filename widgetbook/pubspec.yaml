name: momeet_widgetbook
description: 모모밋 위젯 카탈로그 (Widgetbook)
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_ui: ^1.1.6
  material_ui: ^1.10.0
  momeet:
    path: ..
  widgetbook: ^3.25.0
  widgetbook_annotation: ^3.11.0

dev_dependencies:
  build_runner: ^2.15.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  widgetbook_generator: ^3.24.0

flutter:
  uses-material-design: true
