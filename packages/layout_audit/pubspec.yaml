name: layout_audit
description: Finds overlapping, clipped, off-screen and ellipsized text and images in a Flutter widget test's render tree.
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  material_ui: ^1.10.0

dev_dependencies:
  flutter_lints: ^6.0.0
