name: Deploy Production

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - '*.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-production:
    name: Production Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - uses: ./.github/actions/codegen
        with:
          api-base-url: ${{ vars.API_BASE_URL }}

      # 앱은 실행 중에 assets/.env를 읽는다. 코드 생성 액션이 쓴 .env를 배포용 값으로 덮어쓴다
      - name: Create .env
        run: |
          mkdir -p assets
          cat <<EOF > assets/.env
          API_BASE_URL=${{ vars.API_BASE_URL }}
          REALTIME_BACKEND=${{ vars.REALTIME_BACKEND }}
          TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
          EOF

      - name: Build Flutter Web
        run: flutter build web --no-pub --wasm --release

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel Output
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
