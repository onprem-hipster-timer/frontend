name: Deploy Production

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - '*.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-production:
    name: Production Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - uses: ./.github/actions/codegen
        with:
          api-base-url: ${{ vars.API_BASE_URL }}

      # 앱은 실행 중에 assets/.env를 읽는다. 코드 생성 액션이 쓴 .env를 배포용 값으로 덮어쓴다
      - name: Create .env
        run: |
          mkdir -p assets
          cat <<EOF > assets/.env
          API_BASE_URL=${{ vars.API_BASE_URL }}
          REALTIME_BACKEND=${{ vars.REALTIME_BACKEND }}
          TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
          EOF

      - name: Build Flutter Web
        run: flutter build web --no-pub --wasm --release

      # 랜딩 기능 카드의 미리보기 그림은 방금 빌드한 앱의 미리보기 화면을 찍어 build/web/landing/previews/에 둔다. 하나라도 찍지 못하면 배포하지 않는다
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install preview capture dependencies
        run: npm ci
        working-directory: tool/landing_previews

      - name: Capture landing previews
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tool/landing_previews/capture.mjs build/web

      # 사이트 주소와 검색 엔진 소유 확인 파일은 저장소 변수로 받는다. 소스에는 기본 주소(https://mo.momeet.date) 말고 배포하는 곳의 값을 두지 않는다
      - name: Apply site settings
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          NAVER_SITE_VERIFICATION: ${{ vars.NAVER_SITE_VERIFICATION }}
        run: |
          set -euo pipefail
          cd build/web
          default_url='https://mo.momeet.date'
          if [ -n "${SITE_URL}" ] && [ "${SITE_URL}" != "${default_url}" ]; then
            if [[ ! "${SITE_URL}" =~ ^https?://[^/[:space:]]+$ ]]; then
              echo "SITE_URL은 끝에 /가 없는 주소여야 합니다(예: https://example.com): ${SITE_URL}" >&2
              exit 1
            fi
            url_escaped="$(printf '%s' "${SITE_URL}" | sed 's/[&#\\]/\\&/g')"
            host_escaped="$(printf '%s' "${SITE_URL#*://}" | sed 's/[&#\\]/\\&/g')"
            sed -i \
              -e "s#https://mo\.momeet\.date#${url_escaped}#g" \
              -e "s#<meta property=\"twitter:domain\" content=\"mo\.momeet\.date\">#<meta property=\"twitter:domain\" content=\"${host_escaped}\">#" \
              index.html meet.html demo.html timer.html sitemap.xml robots.txt
          fi
          if [ -n "${NAVER_SITE_VERIFICATION}" ]; then
            if [[ ! "${NAVER_SITE_VERIFICATION}" =~ ^naver[0-9a-f]+$ ]]; then
              echo "NAVER_SITE_VERIFICATION은 확장자를 뺀 네이버 확인 파일 이름이어야 합니다(예: naver0123abcd): ${NAVER_SITE_VERIFICATION}" >&2
              exit 1
            fi
            printf 'naver-site-verification: %s.html\n' "${NAVER_SITE_VERIFICATION}" > "${NAVER_SITE_VERIFICATION}.html"
          fi

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel Output
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
