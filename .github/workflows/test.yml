name: CI

# 필수 상태 체크로 지정하면 이 경로만 바꾼 PR은 체크가 대기 상태로 남는다
on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  # dev push는 dev 범위 캐시를 만들어 dev로 가는 PR이 복원할 수 있게 한다
  push:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Format, Analyze & Package Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # 생성 파일이 없어도 되는 검사라 코드 생성보다 먼저 돌려 빨리 실패한다
      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - uses: ./.github/actions/codegen
        with:
          api-base-url: ${{ vars.API_BASE_URL }}

      # 루트 analyze가 packages/momeet_lints도 분석하므로 그 의존성을 먼저 받는다
      - name: Install lint plugin dependencies
        run: cd packages/momeet_lints && dart pub get

      # flutter analyze는 analyzer 플러그인(momeet_lints) 결과를 기다리지 않는다
      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Layout audit library tests
        run: cd packages/layout_audit && flutter pub get && flutter test

      - name: Lint rule tests
        run: cd packages/momeet_lints && dart test

  test:
    name: Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # 샤드마다 셋업·코드 생성 비용이 붙어 2개를 넘기면 이득이 거의 없다
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - uses: ./.github/actions/codegen
        with:
          api-base-url: ${{ vars.API_BASE_URL }}

      - name: Run tests
        run: flutter test --total-shards=2 --shard-index=${{ matrix.shard }}

  arch-guard:
    name: Auth Architecture Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check auth_provider.dart changes
        id: check-auth
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD -- \
            lib/core/providers/auth_provider.dart)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Warn on auth_provider.dart modification
        if: steps.check-auth.outputs.changed == 'true'
        run: |
          echo "::warning file=lib/core/providers/auth_provider.dart::\
          auth_provider.dart가 변경되었습니다. \
          인증 아키텍처 규칙을 반드시 확인하세요: \
          (1) Kratos 호출은 KratosClient를 거쳐 auth_provider.dart에서만 \
          (2) 세션 토큰은 SessionTokenStore(보안 저장소)에만, 상태에는 백엔드용 JWT만 \
          (3) AuthErrorType.classify로 에러 처리 위임"

      - name: Add PR label
        if: steps.check-auth.outputs.changed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['auth-architecture']
            });
