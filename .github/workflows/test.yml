name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Compute codegen input hash
        id: codegen-hash
        run: |
          HASH=$(find lib -name '*.dart' \
            ! -name '*.g.dart' ! -name '*.freezed.dart' \
            -print0 | sort -z | xargs -0 sha256sum | sha256sum | head -c 64)
          echo "key=codegen-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${HASH}" >> $GITHUB_OUTPUT

      - name: Restore codegen cache
        uses: actions/cache/restore@v4
        id: codegen-cache
        with:
          path: |
            .dart_tool/build
            lib/**/*.g.dart
            lib/**/*.freezed.dart
          key: ${{ steps.codegen-hash.outputs.key }}
          restore-keys: |
            codegen-${{ runner.os }}-

      - name: Create .env for analysis
        run: |
          mkdir -p assets
          cat <<EOF > assets/.env
          API_BASE_URL=${{ vars.API_BASE_URL }}
          EOF

      - name: Run code generation
        if: steps.codegen-cache.outputs.cache-hit != 'true'
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Save codegen cache
        if: always() && steps.codegen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .dart_tool/build
            lib/**/*.g.dart
            lib/**/*.freezed.dart
          key: ${{ steps.codegen-hash.outputs.key }}

      - name: Cleanup old codegen caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_KEY="${{ steps.codegen-hash.outputs.key }}"
          gh cache list --key codegen- --limit 100 --json id,key --jq \
            ".[] | select(.key != \"$CURRENT_KEY\") | .id" \
          | while read id; do
              gh cache delete "$id" || true
            done

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      # 루트 analyze가 packages/momeet_lints도 분석하므로 그 의존성을 먼저 받는다
      - name: Install lint plugin dependencies
        run: cd packages/momeet_lints && dart pub get

      # flutter analyze는 analyzer 플러그인(momeet_lints) 결과를 기다리지 않는다
      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Layout audit library tests
        run: cd packages/layout_audit && flutter pub get && flutter test

      - name: Lint rule tests
        run: cd packages/momeet_lints && dart test

  arch-guard:
    name: Auth Architecture Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check auth_provider.dart changes
        id: check-auth
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..HEAD -- \
            lib/core/providers/auth_provider.dart)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Warn on auth_provider.dart modification
        if: steps.check-auth.outputs.changed == 'true'
        run: |
          echo "::warning file=lib/core/providers/auth_provider.dart::\
          auth_provider.dart가 변경되었습니다. \
          인증 아키텍처 규칙을 반드시 확인하세요: \
          (1) Kratos 호출은 KratosClient를 거쳐 auth_provider.dart에서만 \
          (2) 세션 토큰은 SharedPreferences에만, 상태에는 백엔드용 JWT만 \
          (3) AuthErrorType.classify로 에러 처리 위임"

      - name: Add PR label
        if: steps.check-auth.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['auth-architecture']
            });
